# 테스트 타깃에는 file_length 를 적용하지 않는다.
# 스위트 하나에 케이스 수십 개가 쌓이는 것이 정상이라 500줄 상한은 분할 압력만 만들고
# 가독성 이득이 없었다 — 실제로 테스트 파일 8개가 개별 `// swiftlint:disable file_length`
# 주석으로 각자 빠져나가 있었다. 예외를 이 한 곳에 모아 "먼저 disable 단 파일이 이긴다"는
# 복권 구조를 없앤다. 나머지 룰(보안 custom_rules 포함)은 루트 설정에서 그대로 상속된다.
disabled_rules:
  - file_length
