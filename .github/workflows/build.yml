name: build

# 로컬 Claude/codex 훅(swift-quality·stop-gate 등)은 기기·우회에 따라 강제되지 않는다.
# 이 워크플로가 서버측 강제 게이트다 — main 으로의 PR 에서 SwiftFormat 린트 +
# SwiftLint + xcodebuild build/test 를 돌린다. main 브랜치 보호(PR 필수 + 이 체크 통과 필수)는
# GitHub 저장소 설정에서 별도로 켠다.
# 게이트 범위: 빌드 + 유닛 테스트 + 린트. UI 테스트는 제외한다(사유는 아래 Build & Test 단계 주석).
#
# 주의(러너 이미지 의존): 앱 배포 타겟(IPHONEOS_DEPLOYMENT_TARGET)을 빌드·실행할 수 있는
# iOS SDK·시뮬레이터가 러너에 있어야 한다. macos-15 러너에는 iOS 시뮬레이터 디바이스가 사전
# 생성돼 있지 않고 여러 세대 런타임이 섞여 있어 `OS=latest` 매칭이 불안정하다. 그래서 최신 Xcode
# (배포 타겟 26.0 SDK 지원)를 고정하고, 설치된 iOS 런타임 중 최신을 골라 시뮬레이터를 직접
# 생성·부팅해 UDID 로 타겟팅한다. (러너 iOS 런타임 < 배포 타겟이면 ineligible 로 매칭 실패한다.)

# 트리거는 PR 만 둔다. feature 푸시까지 받으면 PR 을 연 브랜치에서 같은 커밋을 두 번 검사하고,
# concurrency 로 한쪽을 취소해도 취소된 런이 체크 목록에 남는다. GitHub 은 cancelled 를 통과로
# 보지 않으므로 위 주석의 브랜치 보호를 켜는 순간 그 흔적이 머지를 막는다. PR 을 열기 전에
# 검사받고 싶으면 draft PR 로 연다.
on:
  pull_request:
    branches: [ main ]

# 같은 PR 에 연달아 푸시하면 앞선 런의 결과는 쓸모가 없으므로 취소하고 최신 커밋만 검사한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  DEVICE_TYPE: 'iPhone 16'

jobs:
  build:
    runs-on: macos-15
    steps:
      # 서브모듈(.ai-context, AI 하네스)은 빌드에 불필요하므로 체크아웃하지 않는다(프라이빗 토큰 회피).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # 린트 도구와 같은 이유로 툴체인도 핀한다. latest-stable 은 러너 이미지가 갱신되면
          # 컴파일러가 조용히 바뀌어, CI 에서만 나는 타입체크 시간 초과 같은 사고로 돌아온다.
          # 러너 이미지(macos-15-arm64)에 설치된 최신 stable 이며, 올릴 땐 로컬 Xcode 도 함께 올린다.
          xcode-version: '26.3'

      - name: Show Xcode / runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install lint tools (pinned)
        # CI-로컬 룰 드리프트 방지: 로컬 훅·verify.sh와 동일 버전으로 핀한다.
        # brew는 항상 latest라 룰이 어긋난다(예: 0.61.1엔 없던 wrapIfStatementBodies).
        # 버전을 올릴 땐 로컬 도구도 함께 올려 동기화한다.
        env:
          SWIFTFORMAT_VERSION: "0.61.1"
          SWIFTLINT_VERSION: "0.63.3"
        run: |
          set -euo pipefail
          brew install xcbeautify
          mkdir -p "$HOME/tools/swiftformat" "$HOME/tools/swiftlint"
          curl --proto '=https' --proto-redir '=https' -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o /tmp/swiftformat.zip
          unzip -o /tmp/swiftformat.zip -d "$HOME/tools/swiftformat" >/dev/null
          curl --proto '=https' --proto-redir '=https' -fsSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" -o /tmp/swiftlint.zip
          unzip -o /tmp/swiftlint.zip -d "$HOME/tools/swiftlint" >/dev/null
          SF_BIN="$(find "$HOME/tools/swiftformat" -name swiftformat -type f | head -1)"
          SL_BIN="$(find "$HOME/tools/swiftlint" -name swiftlint -type f | head -1)"
          chmod +x "$SF_BIN" "$SL_BIN"
          dirname "$SF_BIN" >> "$GITHUB_PATH"
          dirname "$SL_BIN" >> "$GITHUB_PATH"

      - name: Show lint tool versions
        run: |
          swiftformat --version
          swiftlint version

      - name: SwiftFormat (lint only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --strict

      - name: Prepare simulator
        id: sim
        run: |
          # 설치된 iOS 런타임 중 최신을 골라 iPhone 16 시뮬레이터를 직접 생성·부팅하고 UDID 를 내보낸다.
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c "
          import json, sys
          rts = [r for r in json.load(sys.stdin)['runtimes']
                 if r.get('isAvailable') and r['identifier'].find('iOS') >= 0]
          rts.sort(key=lambda r: [int(x) for x in r['version'].split('.')])
          print(rts[-1]['identifier'])")
          echo "Using runtime: $RUNTIME"
          UDID=$(xcrun simctl create ci-iphone "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & Test
        # UI 테스트(woni_appUITests)는 CI 게이트에서 제외한다. 두 가지 이유다.
        #  ① 러너가 클론 2개로 병렬 실행하는데, 이 스위트는 기준 통화·선택일 같은 앱 상태를
        #     바꿨다 되돌리는 케이스를 포함해 클론 간 스케줄링에 따라 무관한 케이스가 실패한다.
        #     실제로 같은 커밋의 두 런이 서로 다른 케이스에서 실패했다(런1: B14·F4, 런2: B5·D6).
        #     같은 3건을 CI와 동일한 iPhone 16에서 순차로 돌리면 전부 통과한다.
        #  ② DisplayMatrixUITests는 iPhone SE(폭 375pt) 전용이라 화면 폭을 먼저 단언한다.
        #     잘못된 기기에서 아무것도 못 잡은 채 통과하는 것을 막으려는 가드이므로,
        #     iPhone 16 러너에서는 설계상 반드시 실패한다.
        # 순차 실행으로 바꾸면 둘 다 해결되지만 CI가 50분을 넘긴다. UI 스위트는 머지 전
        # 로컬에서 별도 명령으로 게이트한다(.claude/docs/qa-case-ledger.md 「실행 명령」).
        # 테스트 코드의 컴파일 오류는 여기서도 잡힌다 — 실행만 건너뛰고 빌드는 그대로 한다.
        #
        # 유닛 타깃도 순차로 돌린다(-parallel-testing-enabled NO). 병렬 실행은 같은 프로세스에서
        # 테스트를 동시에 돌리는데, 테스트 코드가 static URLProtocol 핸들러나 continuation 게이트
        # 같은 공유 상태를 병렬 전제 없이 쓴다. 한쪽의 defer가 다른 쪽의 스텁을 지우면 그 요청이
        # 실제 네트워크로 나가 멈추고, 그 clone이 막히면 세션이 조기 종료돼 아직 큐에 있던
        # 테스트가 실행조차 못 한 채 실패로 집계된다(실측 2026-08-21: 3연속 실패, 매번 다른
        # 테스트 1건이 통과·실패 어느 목록에도 나타나지 않았다).
        # verify.sh(로컬 게이트)가 같은 이유로 이미 순차다 — CI만 병렬이면 두 게이트가 서로 다른
        # 것을 검증하게 되고, 로컬 그린이 CI 그린을 보장하지 못한다. 공유 상태를 병렬 안전하게
        # 정리하는 것은 별건으로 남긴다.
        run: |
          set -o pipefail
          xcodebuild -project woni_app.xcodeproj -scheme woni_app \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -skip-testing:woni_appUITests \
            clean build test | xcbeautify
